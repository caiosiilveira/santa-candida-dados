# Índice dos santos da Paulus (dia → santos e a página de cada um): uma vez por mês,
# relê a lista e, se mudou, guarda o novo indice-santos.json no próprio repositório.
# O robô diário usa esse arquivo para achar a publicação de cada dia.
name: Índice de santos

on:
  schedule:
    - cron: '17 4 1 * *' # dia 1, 01:17 em São Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indice-santos

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ler a lista da Paulus
        run: node indice-santos.mjs
      - name: Guardar se mudou
        run: |
          git config user.name "Robô do índice de santos"
          git config user.email "actions@users.noreply.github.com"
          git add indice-santos.json
          git diff --cached --quiet || (git commit -q -m "Índice de santos atualizado" && git push -q)
