# Uma vez por mês: o índice dos santos da Paulus (dia → santos, a página e a miniatura de
# cada um) e a lista do Folheto Povo de Deus da Arquidiocese (data → PDFs do folheto e das
# partituras). O que mudar é guardado no próprio repositório; o robô diário leva os dois
# arquivos para a branch dados. A Arquidiocese publica os folhetos com meses de
# antecedência, então uma leitura por mês cobre a lista.
name: Índice de santos

on:
  schedule:
    - cron: '17 4 1 * *' # dia 1, 01:17 em São Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indice-santos

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ler a lista da Paulus
        run: node indice-santos.mjs
      - name: Ler a lista do Folheto Povo de Deus
        # Se a Arquidiocese falhar, fica a lista do mês anterior.
        run: node folhetos.mjs . || true
      - name: Guardar se mudou
        run: |
          git config user.name "Robô do índice de santos"
          git config user.email "actions@users.noreply.github.com"
          git add indice-santos.json folhetos.json
          git diff --cached --quiet || (git commit -q -m "Índice de santos e folhetos atualizados" && git push -q)
