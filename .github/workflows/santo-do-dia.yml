# Santo do dia: uma vez por dia (e de novo mais tarde, caso a Canção Nova atrase), lê
# o santo da Canção Nova, a publicação da Paulus e a lista do Folheto Povo de Deus e publica arquivos pequenos na
# branch "dados". O site lê esses arquivos direto do GitHub: nada roda nem fica
# guardado na Cloudflare. Horários em UTC (São Paulo = UTC-3).
name: Santo do dia

on:
  schedule:
    - cron: '7 3 * * *' # 00:07 em São Paulo
    - cron: '37 6 * * *' # 03:37, reserva
    - cron: '7 11 * * *' # 08:07, reserva
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santo-do-dia

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ler o santo do dia
        run: node santo-do-dia.mjs saida
      - name: Ler os folhetos Povo de Deus
        # Se a Arquidiocese falhar, mantém o arquivo de ontem (a branch é recriada a cada vez).
        run: node folhetos.mjs saida || curl -sf -o saida/folhetos.json "https://raw.githubusercontent.com/${{ github.repository }}/dados/folhetos.json" || true
      - name: Publicar na branch dados
        # Uma branch só com os arquivos, recriada a cada vez: o repositório não cresce.
        run: |
          cd saida
          git init -q -b dados
          git config user.name "Robô do santo do dia"
          git config user.email "actions@users.noreply.github.com"
          git add santo.json indice-santos.json $(ls folhetos.json 2>/dev/null)
          git commit -q -m "Santo do dia $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados
